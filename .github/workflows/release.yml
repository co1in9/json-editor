name: Build and release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x86_64
          - os: macos-15-intel
            platform: macos-x86_64
          - os: macos-15
            platform: macos-aarch64
    steps:
      - uses: actions/checkout@v4

      # Hosted runners access crates.io directly instead of the local mirror.
      - name: Use crates.io
        shell: bash
        run: rm .cargo/config.toml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}-release

      - name: Check formatting
        run: cargo fmt --check

      - name: Run tests
        run: cargo test --locked

      - name: Build Windows
        if: runner.os == 'Windows'
        run: cargo build --release --locked

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -Path target/release/json-editor.exe -DestinationPath dist/json-editor-${{ matrix.platform }}.zip

      - name: Build and package macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          sh scripts/build-macos-app.sh
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "target/release/JSON Editor.app" "dist/json-editor-${{ matrix.platform }}.zip"

      - name: Upload build assets
        uses: actions/upload-artifact@v4
        with:
          name: json-editor-${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Download build assets
        uses: actions/download-artifact@v4
        with:
          pattern: json-editor-*
          merge-multiple: true
          path: dist

      - name: Create checksums
        working-directory: dist
        run: sha256sum *.zip > SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS.txt --clobber
